[build]
  # `pnpm run ci` antes de `pnpm build`: hasta el 2026-08-08 nada entre el
  # commit y el despliegue ejecutaba un solo test -- una regresion podia
  # llegar a produccion con el gate en rojo sin que nadie lo notara
  # (auditoria 2026-08-08). El script `ci` (typecheck + lint + format +
  # tests) lo define `package.json`. OJO: tiene que ser `pnpm run ci` -- un
  # `pnpm ci` a secas ejecuta el clean-install interno de pnpm y sale 0 sin
  # correr el gate, aunque el script exista (medido el 2026-08-08).
  #
  # Y `pnpm measure:js` DESPUÉS del build (añadido el 2026-09-05): el censo del
  # bundle (`scripts/home-js-baseline.<plataforma>.json`) se puede recortar y volver a
  # sellar a mano sin tocar el build —el sello es una función pura sobre el
  # propio JSON—, así que el gate por sí solo no lo ve; medido contra el
  # artefacto recién construido, un censo que no cuadra devuelve código 1 y el
  # despliegue no publica. Los tres eslabones van unidos por `&&` a propósito y
  # en este orden: si falla el gate no se construye, y si falla el censo no se
  # publica. `scripts/build-pipeline.test.mjs` ata esa secuencia; el riesgo de
  # comparar un censo generado en Windows contra un build hecho en el runner
  # está declarado en la cabecera de `.github/workflows/ci.yml`.
  command = "pnpm run ci && pnpm build && pnpm measure:js"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Los chunks de `_next/static/` llevan el hash de contenido en el propio
# nombre de fichero (Next los regenera con un nombre nuevo en cada build que
# cambia su contenido), asi que "immutable" es correcto: el navegador nunca
# necesita revalidar una URL que, si el contenido cambiara, ya seria otra URL.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Los WebP de `public/` (Aura, el ojo, etc.) NO llevan hash en el nombre --
# son rutas fijas que un redeploy puede sobrescribir con contenido distinto,
# asi que "immutable" aqui mentiria. 30 dias + `stale-while-revalidate` de 7:
# el navegador sirve la copia cacheada al instante y revalida en segundo
# plano, sin bloquear la siguiente visita a la espera de la red.
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

# La imagen Open Graph que genera `app/opengraph-image.tsx` se emite en `out/`
# SIN extensión (`out/opengraph-image`): ese es el nombre que Next da a la
# ruta de metadata, y no hay forma de cambiarlo. Un servidor de ficheros
# estáticos deduce el tipo de la extensión, así que sin esta cabecera lo
# serviría como `application/octet-stream` y los rastreadores de Facebook,
# LinkedIn o X descartarían la vista previa -- la mayoría exige un
# `Content-Type` de imagen y no husmea el contenido del fichero.
#
# Que el fichero ES un PNG válido está verificado en el build, no supuesto:
# firma `89 50 4E 47 0D 0A 1A 0A` y cabecera IHDR con 1200x630.
[[headers]]
  for = "/opengraph-image"

  [headers.values]
    Content-Type = "image/png"

# Rutas retiradas en la revisión legal del 2026-08-08. Las dos estuvieron
# publicadas desde el 2026-08-05, así que un 404 seco dejaría enlaces rotos y
# le pediría a un rastreador que descubriera por su cuenta qué ha pasado.
#
# `force = false` (el valor por defecto, explícito aquí para que se lea): con
# `output: "export"` los ficheros `terminos.html` y `accesibilidad.html` ya no
# se generan, así que no hay nada que la redirección tenga que sobrescribir;
# dejarlo en falso significa que si algún día vuelve a existir un fichero real
# en esa ruta, gana el fichero y no esta regla.
#
# Cada destino se elige por EQUIVALENCIA, no por comodidad:
# - `/terminos` -> `/aviso-legal`: sus cláusulas con sentido aquí (uso
#   permitido, propiedad intelectual, enlaces a terceros, disponibilidad,
#   responsabilidad, ley aplicable) están ahora dentro del aviso legal. Quien
#   llegue buscando lo que había, lo encuentra.
# - `/accesibilidad` -> `/`: NO tiene equivalente. Redirigirla al aviso legal
#   o a la privacidad llevaría a un documento que no habla de lo que la
#   persona buscaba, que es peor que devolverla a la portada.
[[redirects]]
  from = "/terminos"
  to = "/aviso-legal"
  status = 301
  force = false

[[redirects]]
  from = "/accesibilidad"
  to = "/"
  status = 301
  force = false

# La 404 de la rama inglesa (2026-09-10, P2 de la crítica externa #21, H9).
# Con `output: "export"` Netlify sirve `out/404.html` para cualquier camino
# inexistente, y ese documento está horneado en castellano: sin JavaScript,
# `/en/no-existe` llegaba con `<html lang="es">` y copia castellana a quien
# venía navegando en inglés (con JavaScript ya se corregía tras hidratar).
#
# Esta regla le da a la rama inglesa su propia 404 horneada, `out/en/404.html`
# (la emite `app/en/404/page.tsx`, con `lang="en"`, la navegación completa y
# «Back to home» hacia `/en`), y la sirve con estado 404, no 200: es el
# mecanismo de «Custom 404 page handling» de la documentación de Netlify.
#
# `force = false` es lo que la hace segura, y va explícito para que se lea: por
# SHADOWING la regla solo se aplica cuando el camino pedido NO existe como
# fichero, así que `/en`, `/en/privacy` y `/en/legal-notice` (y los assets) se
# siguen sirviendo tal cual. La 404 castellana no cambia: todo lo que no cae
# bajo `/en/` sigue recibiendo `out/404.html`. Candado en
# `scripts/build-pipeline.test.mjs`.
[[redirects]]
  from = "/en/*"
  to = "/en/404.html"
  status = 404
  force = false
